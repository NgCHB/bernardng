<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drawing an Addition Polymer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#5d6878;--acc:#d9480f;--pri:#1864ab;--bd:#dde1e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#9aa6b6;--acc:#ff922b;--pri:#4dabf7;--bd:#2c3542}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#9aa6b6;--acc:#ff922b;--pri:#4dabf7;--bd:#2c3542}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:4px 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;padding:8px 10px;font-size:.9rem}
.sub{color:var(--mute);font-size:.9rem;margin:10px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;overflow-x:auto}
svg{width:100%;height:auto;display:block}
@keyframes f{from{opacity:0}to{opacity:1}}
.bond{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.bond.hl{stroke:var(--acc)}
.atom{fill:var(--ink);font-size:24px;font-weight:600;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.n{fill:var(--ink);font-size:26px;font-style:italic;font-family:Georgia,serif;text-anchor:middle}
.tag{fill:var(--mute);font-size:13px;text-anchor:middle;font-family:system-ui,sans-serif}
.tint{fill:var(--acc)}
#try{display:none;text-align:center;padding:26px 14px;animation:f .45s}
#try .big{font-size:2.6rem}
#try h2{margin:6px 0 10px;font-size:1.2rem}
#try ol{display:inline-block;text-align:left;margin:0 0 10px;padding-left:22px;line-height:1.8}
#try p{color:var(--mute);margin:6px 0 0}
.desc{margin-top:12px;padding:14px 16px;background:var(--card);border-radius:10px;border:1px solid var(--bd);border-left:5px solid var(--pri);min-height:60px}
.desc b{display:block;font-size:1.05rem;margin-bottom:4px}
.desc span{color:var(--mute)}
.seg{display:none;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg.show{display:flex}
.seg button{flex:1;min-width:130px;padding:9px 10px;font-size:.9rem}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.dots{flex:1;display:flex;gap:8px;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dot.on{background:var(--pri)}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pri)}
button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="wrap">
<h1>Drawing an addition polymer</h1>
<div class="tabs" id="tabs"></div>
<p class="sub" id="sub"></p>
<div class="card" id="card"><svg id="svg" viewBox="0 0 580 345" role="img" aria-label="Structural formula at the current step"><g id="g"></g></svg></div>
<div class="card" id="try">
<div class="big">✏️</div>
<h2>Your turn!</h2>
<ol><li>Draw the repeat unit</li><li>Draw a section of the polymer (3 repeat units)</li><li>Draw the polymer, using square brackets and <i>n</i></li></ol>
<p>Try all three on paper first, then click <b>Check my answers</b> to review.</p>
</div>
<div class="seg" id="seg">
<button class="sec" data-m="0">Repeat unit</button>
<button class="sec" data-m="1">Section of polymer</button>
<button class="sec" data-m="2">Polymer</button>
</div>
<div class="desc" id="desc"></div>
<div class="bar">
<button class="sec" id="back">Back</button>
<div class="dots" id="dots"></div>
<button id="next">Next</button>
</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg"),g=document.getElementById("g"),R=15,Y=210;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function build(A,B,extra){
  g.innerHTML="";
  extra&&extra();
  B.forEach(([a,c,o,cls])=>{
    const P=A[a],Q=A[c];let dx=Q[1]-P[1],dy=Q[2]-P[2];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
    const sa=P[0]?R:0,sc=Q[0]?R:0;
    const x1=P[1]+dx*sa,y1=P[2]+dy*sa,x2=Q[1]-dx*sc,y2=Q[2]-dy*sc;
    (o===2?[-5,5]:[0]).forEach(k=>el("line",{x1:x1-dy*k,y1:y1+dx*k,x2:x2-dy*k,y2:y2+dx*k,class:"bond "+(cls||"")},g));
  });
  for(const k in A){const[l,x,y]=A[k];if(l){el("text",{x,y,class:"atom"},g).textContent=l}}
  g.style.animation="none";g.getBoundingClientRect();g.style.animation="f .45s";
}
// one repeat unit: left C (methyl up, H down) and right C (H up or methyl up, H down)
function unit(A,B,t,xL,xR,off,order,cls,meR){
  A[t+"L"]=["C",xL,Y];A[t+"R"]=["C",xR,Y];A[t+"m"]=["C",xL,125];
  A[t+"a"]=["H",xL-off,125];A[t+"b"]=["H",xL+off,125];A[t+"c"]=["H",xL,40];A[t+"d"]=["H",xL,295];A[t+"f"]=["H",xR,295];
  B.push([t+"L",t+"R",order,cls],[t+"L",t+"m",1],[t+"m",t+"a",1],[t+"m",t+"b",1],[t+"m",t+"c",1],[t+"L",t+"d",1],[t+"R",t+"f",1]);
  if(meR){
    A[t+"e"]=["C",xR,125];A[t+"g"]=["H",xR-off,125];A[t+"h"]=["H",xR+off,125];A[t+"i"]=["H",xR,40];
    B.push([t+"R",t+"e",1],[t+"e",t+"g",1],[t+"e",t+"h",1],[t+"e",t+"i",1]);
  }else{A[t+"e"]=["H",xR,125];B.push([t+"R",t+"e",1])}
}
const EX=[
{tab:"Example 1: Propene",sub:"poly(propene) from propene, C<sub>3</sub>H<sub>6</sub>",frames:["f1","f2","f3"],
 xL:220,xR:360,off:65,meR:false,sp:120,soff:58,
 f1:()=>[{a:["C",170,Y],b:["C",290,Y],c:["C",410,Y],h1:["H",115,140],h2:["H",115,280],h3:["H",290,125],h4:["H",410,125],h5:["H",410,295],h6:["H",490,Y]},
  [["a","b",2],["b","c",1],["a","h1",1],["a","h2",1],["b","h3",1],["c","h4",1],["c","h5",1],["c","h6",1]]]},
{tab:"Example 2: But-2-ene",sub:"poly(but-2-ene) from but-2-ene, C<sub>4</sub>H<sub>8</sub>",frames:["f1","f2","try","f3"],
 xL:200,xR:380,off:55,meR:true,sp:150,soff:55,
 f1:()=>[{a:["C",100,Y],b:["C",220,Y],c:["C",340,Y],d:["C",460,Y],h1:["H",100,125],h2:["H",100,295],h3:["H",40,Y],h4:["H",220,125],h5:["H",340,125],h6:["H",460,125],h7:["H",460,295],h8:["H",520,Y]},
  [["a","b",1],["b","c",2],["c","d",1],["a","h1",1],["a","h2",1],["a","h3",1],["b","h4",1],["c","h5",1],["d","h6",1],["d","h7",1],["d","h8",1]]]}
];
function frame3(e,m){
  const A={},B=[];let vb=580;
  if(m===0){
    unit(A,B,"u",e.xL,e.xR,e.off,1,"",e.meR);
    A.o1=["",e.xL-80,Y];A.o2=["",e.xR+80,Y];B.push(["o1","uL",1,"hl"],["uR","o2",1,"hl"]);
    build(A,B);
  }else if(m===1){
    const x0=80,sp=e.sp;vb=x0+5*sp+80;
    for(let k=0;k<3;k++)unit(A,B,"u"+k,x0+2*sp*k,x0+2*sp*k+sp,e.soff,1,"",e.meR);
    A.o1=["",x0-50,Y];A.o2=["",x0+5*sp+50,Y];
    B.push(["o1","u0L",1],["u2R","o2",1],["u0R","u1L",1],["u1R","u2L",1]);
    build(A,B,()=>{for(let k=0;k<3;k++){
      el("rect",{x:x0-sp/2+2*sp*k,y:18,width:2*sp,height:300,rx:10,class:"tint",opacity:k%2?.14:.06},g);
      el("text",{x:x0+sp/2+2*sp*k+sp/2,y:336,class:"tag"},g).textContent="repeat unit";}});
  }else{
    unit(A,B,"u",e.xL,e.xR,e.off,1,"",e.meR);
    const bl=e.xL-e.off-20,br=580-bl;
    A.o1=["",bl-40,Y];A.o2=["",br+40,Y];B.push(["o1","uL",1],["uR","o2",1]);
    build(A,B,()=>{
      el("path",{d:`M${bl+12} 22H${bl}V318H${bl+12}`,class:"bond"},g);
      el("path",{d:`M${br-12} 22H${br}V318H${br-12}`,class:"bond"},g);
      el("text",{x:br+18,y:335,class:"n"},g).textContent="n";});
  }
  return vb;
}
const MODES=[["Repeat unit",""],["Section of polymer","3 repeat units joined together."],["Polymer","The repeat unit goes in square brackets, with n (a large number) in the lower right corner."]];
const TXT={f1:["Step 1","Redraw the alkene in the form of a 'H' with the C=C in the middle."],f2:["Step 2","Erase one bond in the C=C and add one bond to each C atom extending outwards."],
 try:["Your turn","Attempt the repeat unit, a section of the polymer and the polymer before you review."]};
let x=0,s=0,m=0;
const $=id=>document.getElementById(id);
const tabs=$("tabs");
EX.forEach((e,i)=>{const b=document.createElement("button");b.textContent=e.tab;b.onclick=()=>{x=i;s=0;m=0;show()};tabs.appendChild(b)});
function show(){
  const e=EX[x],fr=e.frames[s];let vb=580;
  $("sub").innerHTML=e.sub;
  $("card").style.display=fr==="try"?"none":"block";
  $("try").style.display=fr==="try"?"block":"none";
  if(fr==="f1"){const[A,B]=e.f1();build(A,B)}
  else if(fr==="f2"){const A={},B=[];unit(A,B,"u",e.xL,e.xR,e.off,2,"hl",e.meR);build(A,B)}
  else if(fr==="f3")vb=frame3(e,m);
  svg.setAttribute("viewBox",`0 0 ${vb} 345`);
  svg.style.minWidth=vb>700?Math.round(vb*.78)+"px":"0";
  const d=fr==="f3"?MODES[m]:TXT[fr];
  $("desc").innerHTML="<b>"+d[0]+"</b>"+(d[1]?"<span>"+d[1]+"</span>":"");
  $("seg").classList.toggle("show",fr==="f3");
  document.querySelectorAll("#seg button").forEach(b=>{const on=+b.dataset.m===m;b.style.background=on?"var(--pri)":"transparent";b.style.color=on?"#fff":"var(--pri)"});
  [...tabs.children].forEach((b,i)=>{const on=i===x;b.className=on?"":"sec"});
  $("dots").innerHTML="";e.frames.forEach((_,k)=>{$("dots").appendChild(Object.assign(document.createElement("div"),{className:"dot"+(k===s?" on":"")}))});
  $("back").disabled=s===0;
  $("next").textContent=s===e.frames.length-1?"Restart":fr==="try"?"Check my answers":"Next";
}
$("next").onclick=()=>{s=s===EX[x].frames.length-1?0:s+1;m=0;show()};
$("back").onclick=()=>{if(s>0){s--;m=0;show()}};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{m=+b.dataset.m;show()});
show();
</script>
</body>
</html>
