<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drawing an Addition Polymer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#5d6878;--acc:#d9480f;--pri:#1864ab;--bd:#dde1e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#9aa6b6;--acc:#ff922b;--pri:#4dabf7;--bd:#2c3542}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--mute:#9aa6b6;--acc:#ff922b;--pri:#4dabf7;--bd:#2c3542}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:4px 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:120px;padding:8px 10px;font-size:.9rem}
.sub{color:var(--mute);font-size:.9rem;margin:10px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
svg{width:100%;height:auto;display:block}
@keyframes f{from{opacity:0}to{opacity:1}}
.bond{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.bond.hl{stroke:var(--acc)}
.atom{fill:var(--ink);font-size:24px;font-weight:600;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.n{fill:var(--ink);font-size:26px;font-style:italic;font-family:Georgia,serif;text-anchor:middle}
.tag{fill:var(--mute);font-size:13px;text-anchor:middle;font-family:system-ui,sans-serif}
.tint{fill:var(--acc)}
.desc{margin-top:12px;padding:14px 16px;background:var(--card);border-radius:10px;border:1px solid var(--bd);border-left:5px solid var(--pri);min-height:60px}
.desc b{display:block;font-size:1.05rem;margin-bottom:4px}
.desc span{color:var(--mute)}
.seg{display:none;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg.show{display:flex}
.seg button{flex:1;min-width:130px;padding:9px 10px;font-size:.9rem}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.dots{flex:1;display:flex;gap:8px;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dot.on{background:var(--pri)}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pri)}
button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="wrap">
<h1>Drawing an addition polymer</h1>
<div class="tabs" id="tabs"></div>
<p class="sub" id="sub"></p>
<div class="card" id="card"><svg id="svg" viewBox="0 0 580 345" role="img" aria-label="Structural formula at the current step"><g id="g"></g></svg></div>
<div class="seg" id="seg">
<button class="sec" data-m="0">Repeat unit</button>
<button class="sec" data-m="1">Section of polymer</button>
<button class="sec" data-m="2">Polymer</button>
</div>
<div class="desc" id="desc"></div>
<div class="bar">
<button class="sec" id="back">Back</button>
<div class="dots" id="dots"></div>
<button id="next">Next</button>
</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg"),g=document.getElementById("g"),R=15,Y=210;
let OY=0; // extra vertical room for examples with a longer side chain
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function build(A,B,extra,still){
  g.innerHTML="";
  extra&&extra();
  B.forEach(([a,c,o,cls,stk,w])=>{
    const P=A[a],Q=A[c];let dx=Q[1]-P[1],dy=Q[2]-P[2];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
    const sa=P[0]?R:0,sc=Q[0]?R:0;
    const x1=P[1]+dx*sa,y1=P[2]+dy*sa,x2=Q[1]-dx*sc,y2=Q[2]-dy*sc;
    (o===2?[-(w==null?5:w),(w==null?5:w)]:[0]).forEach(k=>el("line",{x1:x1-dy*k,y1:y1+dx*k,x2:x2-dy*k,y2:y2+dx*k,class:"bond "+(cls||""),style:stk?"stroke:"+stk:""},g));
  });
  for(const k in A){const[l,x,y]=A[k];if(l){el("text",{x,y,class:"atom"},g).textContent=l}}
  if(!still){g.style.animation="none";g.getBoundingClientRect();g.style.animation="f .45s"}
}
// one repeat unit: left C carries a methyl (or ethyl), right C carries H (or a methyl)
function unit(A,B,t,xL,xR,off,order,cls,meR,eth){
  const y=Y+OY;
  A[t+"L"]=["C",xL,y];A[t+"R"]=["C",xR,y];A[t+"m"]=["C",xL,y-85];
  A[t+"a"]=["H",xL-off,y-85];A[t+"b"]=["H",xL+off,y-85];A[t+"d"]=["H",xL,y+85];A[t+"f"]=["H",xR,y+85];
  B.push([t+"L",t+"R",order,cls],[t+"L",t+"m",1],[t+"m",t+"a",1],[t+"m",t+"b",1],[t+"m",t+"c",1],[t+"L",t+"d",1],[t+"R",t+"f",1]);
  if(eth){
    A[t+"c"]=["C",xL,y-170];A[t+"c1"]=["H",xL-off,y-170];A[t+"c2"]=["H",xL+off,y-170];A[t+"c3"]=["H",xL,y-255];
    B.push([t+"c",t+"c1",1],[t+"c",t+"c2",1],[t+"c",t+"c3",1]);
  }else A[t+"c"]=["H",xL,y-170];
  if(meR){
    A[t+"e"]=["C",xR,y-85];A[t+"g"]=["H",xR-off,y-85];A[t+"h"]=["H",xR+off,y-85];A[t+"i"]=["H",xR,y-170];
    B.push([t+"R",t+"e",1],[t+"e",t+"g",1],[t+"e",t+"h",1],[t+"e",t+"i",1]);
  }else{A[t+"e"]=["H",xR,y-85];B.push([t+"R",t+"e",1])}
}
const EX=[
{tab:"Example 1: Propene",sub:"poly(propene) from propene, C<sub>3</sub>H<sub>6</sub>",frames:["f1","f2","f3"],
 xL:220,xR:360,off:65,meR:false,eth:false,oy:0,sp:120,soff:58,
 mp:{b:"L",c:"R",a:"m",h1:"a",h2:"b",h3:"c",h4:"d",h5:"e",h6:"f"},
 f1:()=>[{a:["C",170,Y],b:["C",290,Y],c:["C",410,Y],h1:["H",170,125],h2:["H",170,295],h3:["H",90,Y],h4:["H",290,295],h5:["H",465,140],h6:["H",465,280]},
  [["a","b",1],["b","c",2,"hl"],["a","h1",1],["a","h2",1],["a","h3",1],["b","h4",1],["c","h5",1],["c","h6",1]]]},
{tab:"Example 2: But-2-ene",sub:"poly(but-2-ene) from but-2-ene, C<sub>4</sub>H<sub>8</sub>",frames:["f1","f2","f3"],
 xL:200,xR:380,off:55,meR:true,eth:false,oy:0,sp:150,soff:55,
 mp:{b:"L",c:"R",a:"m",d:"e",h1:"a",h2:"b",h3:"c",h4:"d",h5:"f",h6:"g",h7:"h",h8:"i"},
 f1:()=>[{a:["C",100,Y],b:["C",220,Y],c:["C",340,Y],d:["C",460,Y],h1:["H",100,125],h2:["H",100,295],h3:["H",40,Y],h4:["H",220,295],h5:["H",340,295],h6:["H",460,125],h7:["H",460,295],h8:["H",520,Y]},
  [["a","b",1],["b","c",2,"hl"],["c","d",1],["a","h1",1],["a","h2",1],["a","h3",1],["b","h4",1],["c","h5",1],["d","h6",1],["d","h7",1],["d","h8",1]]]},
{tab:"Example 3: But-1-ene",sub:"poly(but-1-ene) from but-1-ene, C<sub>4</sub>H<sub>8</sub>",frames:["f1","f2","f3"],
 xL:220,xR:360,off:65,meR:false,eth:true,oy:85,sp:120,soff:58,
 mp:{b:"L",a:"R",c:"m",d:"c",h3:"d",h1:"e",h2:"f",h4:"a",h5:"b",h6:"c1",h7:"c2",h8:"c3"},
 f1:()=>{const c=Y+42;return[{a:["C",480,c],b:["C",360,c],c:["C",240,c],d:["C",120,c],h1:["H",535,c-70],h2:["H",535,c+70],h3:["H",360,c+85],h4:["H",240,c-85],h5:["H",240,c+85],h6:["H",120,c-85],h7:["H",120,c+85],h8:["H",60,c]},
  [["a","b",2,"hl"],["b","c",1],["c","d",1],["a","h1",1],["a","h2",1],["b","h3",1],["c","h4",1],["c","h5",1],["d","h6",1],["d","h7",1],["d","h8",1]]]}}
];
function frame3(e,m){
  const A={},B=[];let vb=580;const y=Y+OY;
  if(m===0){
    unit(A,B,"u",e.xL,e.xR,e.off,1,"",e.meR,e.eth);
    A.o1=["",e.xL-80,y];A.o2=["",e.xR+80,y];B.push(["o1","uL",1,"hl"],["uR","o2",1,"hl"]);
    build(A,B);
  }else if(m===1){
    const x0=80,sp=e.sp;vb=x0+5*sp+80;
    for(let k=0;k<3;k++)unit(A,B,"u"+k,x0+2*sp*k,x0+2*sp*k+sp,e.soff,1,"",e.meR,e.eth);
    A.o1=["",x0-50,y];A.o2=["",x0+5*sp+50,y];
    B.push(["o1","u0L",1],["u2R","o2",1],["u0R","u1L",1],["u1R","u2L",1]);
    build(A,B,()=>{for(let k=0;k<3;k++){
      el("rect",{x:x0-sp/2+2*sp*k,y:18,width:2*sp,height:300+OY,rx:10,class:"tint",opacity:k%2?.14:.06},g);
      el("text",{x:x0+sp/2+2*sp*k+sp/2,y:336+OY,class:"tag"},g).textContent="repeat unit";}});
  }else{
    unit(A,B,"u",e.xL,e.xR,e.off,1,"",e.meR,e.eth);
    const bl=e.xL-e.off-20,br=580-bl;
    A.o1=["",bl-40,y];A.o2=["",br+40,y];B.push(["o1","uL",1],["uR","o2",1]);
    build(A,B,()=>{
      el("path",{d:`M${bl+12} 22H${bl}V${318+OY}H${bl+12}`,class:"bond"},g);
      el("path",{d:`M${br-12} 22H${br}V${318+OY}H${br-12}`,class:"bond"},g);
      el("text",{x:br+18,y:335+OY,class:"n"},g).textContent="n";});
  }
  return vb;
}
const MODES=[["Repeat unit",""],["Section of polymer","3 repeat units joined together."],["Polymer","The repeat unit goes in square brackets, with n (a large number) in the lower right corner."]];
const TXT={f1:["Step 1","Redraw the alkene in the form of a 'H' with the C=C in the middle."],f2:["Step 2","Erase one bond in the C=C and add one bond to each C atom extending outwards."]};
let ANIM=false,raf=0;
// rotate the bonds of the step-1 alkene into the "H" layout of step 2
function morph(e){
  const [A1,B1]=e.f1(),A2={},B2=[];
  unit(A2,B2,"u",e.xL,e.xR,e.off,2,"hl",e.meR,e.eth);
  const root=Object.keys(e.mp).find(k=>e.mp[k]==="L"),par={},order=[root],seen=new Set([root]);
  for(let i=0;i<order.length;i++){const p=order[i];B1.forEach(([a,c])=>{const o=a===p?c:c===p?a:null;if(o&&!seen.has(o)){seen.add(o);par[o]=p;order.push(o)}})}
  const V=k=>A2["u"+e.mp[k]],info={};
  order.slice(1).forEach(k=>{const p=par[k],a=A1[k],b=A1[p],c=V(k),d=V(p);
    const a1=Math.atan2(a[2]-b[2],a[1]-b[1]),a2=Math.atan2(c[2]-d[2],c[1]-d[1]);
    let da=a2-a1;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
    info[k]={a1,da,l1:Math.hypot(a[1]-b[1],a[2]-b[2]),l2:Math.hypot(c[1]-d[1],c[2]-d[2])}});
  const r1=A1[root],r2=V(root),t0=performance.now(),D=1600;
  function step(now){
    const t=Math.min(1,(now-t0)/D),k=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,P={},A={};
    P[root]=[r1[1]+(r2[1]-r1[1])*k,r1[2]+(r2[2]-r1[2])*k];
    A[root]=[A1[root][0],P[root][0],P[root][1]];
    order.slice(1).forEach(n=>{const i=info[n],an=i.a1+i.da*k,l=i.l1+(i.l2-i.l1)*k,q=P[par[n]];
      P[n]=[q[0]+Math.cos(an)*l,q[1]+Math.sin(an)*l];A[n]=[A1[n][0],P[n][0],P[n][1]]});
    build(A,B1.map(([a,c,o])=>o===2?[a,c,o,"hl"]:[a,c,o]),null,true);
    if(t<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
// step 3: C=C becomes a single bond and a dangling bond grows from each end
function morph3(e){
  const A={},B=[];
  unit(A,B,"u",e.xL,e.xR,e.off,1,"",e.meR,e.eth);
  const y=Y+OY,t0=performance.now(),D=1400;
  function step(now){
    const t=Math.min(1,(now-t0)/D),k=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,A2=Object.assign({},A);
    A2.o1=["",e.xL-R-(80-R)*k,y];A2.o2=["",e.xR+R+(80-R)*k,y];
    const bonds=B.map((b,i)=>i===0?(t<1?[b[0],b[1],2,"","color-mix(in srgb,var(--ink) "+k*100+"%,var(--acc))",5*(1-k)]:[b[0],b[1],1]):b);
    if(k>.02)bonds.push(["o1","uL",1,"hl"],["uR","o2",1,"hl"]);
    build(A2,bonds,null,true);
    if(t<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
let x=0,s=0,m=0;
const $=id=>document.getElementById(id);
const tabs=$("tabs");
EX.forEach((e,i)=>{const b=document.createElement("button");b.textContent=e.tab;b.onclick=()=>{x=i;s=0;m=0;show()};tabs.appendChild(b)});
function show(){
  cancelAnimationFrame(raf);
  const e=EX[x],fr=e.frames[s];let vb=580;OY=e.oy;
  $("sub").innerHTML=e.sub;
  if(fr==="f1"){const[A,B]=e.f1();build(A,B)}
  else if(fr==="f2"){if(ANIM)morph(e);else{const A={},B=[];unit(A,B,"u",e.xL,e.xR,e.off,2,"hl",e.meR,e.eth);build(A,B)}}
  else if(fr==="f3"){if(ANIM&&m===0)morph3(e);else vb=frame3(e,m)}
  svg.setAttribute("viewBox",`0 0 ${vb} ${345+OY}`);
  const d=fr==="f3"?MODES[m]:TXT[fr];
  $("desc").innerHTML="<b>"+d[0]+"</b>"+(d[1]?"<span>"+d[1]+"</span>":"");
  $("seg").classList.toggle("show",fr==="f3");
  document.querySelectorAll("#seg button").forEach(b=>{const on=+b.dataset.m===m;b.style.background=on?"var(--pri)":"transparent";b.style.color=on?"#fff":"var(--pri)"});
  [...tabs.children].forEach((b,i)=>{b.className=i===x?"":"sec"});
  $("dots").innerHTML="";e.frames.forEach((_,k)=>{$("dots").appendChild(Object.assign(document.createElement("div"),{className:"dot"+(k===s?" on":"")}))});
  $("back").disabled=s===0;
  $("next").textContent=s===e.frames.length-1?"Restart":"Next";
}
$("next").onclick=()=>{s=s===EX[x].frames.length-1?0:s+1;m=0;ANIM=EX[x].frames[s]==="f2"||EX[x].frames[s]==="f3";show();ANIM=false};
$("card").onclick=()=>{const f=EX[x].frames[s];if(f==="f2"||(f==="f3"&&m===0)){ANIM=true;show();ANIM=false}};
$("back").onclick=()=>{if(s>0){s--;m=0;show()}};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{m=+b.dataset.m;show()});
show();
</script>
</body>
</html>
