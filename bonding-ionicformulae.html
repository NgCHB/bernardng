<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ionic Compound Balancer</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }
    
    .ion-card {
      transition: all 0.3s ease;
    }
    
    .ion-card:hover {
      transform: translateY(-2px);
    }
    
    .counter-btn {
      transition: all 0.2s ease;
      user-select: none;
    }
    
    .counter-btn:active {
      transform: scale(0.95);
    }
    
    .charge-badge {
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .success-animation {
      animation: celebrate 0.6s ease;
    }
    
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.05); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.02); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app-wrapper" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
   <div style="min-height: 100%; padding: 2rem;">
    <div style="max-width: 56rem; margin: 0 auto;"><!-- Instructions -->
     <div style="text-align: center; margin-bottom: 2rem;">
      <p id="instructions" style="font-size: 1.125rem; color: #e0e7ff;">Adjust the quantities until the net charge equals zero</p>
     </div><!-- Main Content Card -->
     <div style="background: #ffffff; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); padding: 2.5rem;"><!-- Ion Cards Container -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-bottom: 2.5rem;"><!-- Cation Card -->
       <div class="ion-card" style="background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
         <div id="cation-label" style="font-size: 0.875rem; font-weight: 600; color: #92400e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
          Cation
         </div>
         <div id="cation-formula" style="font-size: 2.5rem; font-weight: 700; color: #78350f; margin-bottom: 0.25rem;">
          Ca²⁺
         </div>
         <div id="cation-name" style="font-size: 1rem; color: #92400e;">
          Calcium
         </div>
        </div><!-- Counter Controls -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 1.5rem;"><button class="counter-btn" onclick="adjustCation(-1)" style="width: 3rem; height: 3rem; background: #78350f; color: #ffffff; border: none; border-radius: 0.75rem; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;"> − </button>
         <div id="cation-count" style="font-size: 3rem; font-weight: 700; color: #78350f; min-width: 4rem; text-align: center;">
          1
         </div><button class="counter-btn" onclick="adjustCation(1)" style="width: 3rem; height: 3rem; background: #78350f; color: #ffffff; border: none; border-radius: 0.75rem; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;"> + </button>
        </div>
       </div><!-- Anion Card -->
       <div class="ion-card" style="background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%); border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
         <div id="anion-label" style="font-size: 0.875rem; font-weight: 600; color: #5b21b6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
          Anion
         </div>
         <div id="anion-formula" style="font-size: 2.5rem; font-weight: 700; color: #4c1d95; margin-bottom: 0.25rem;">
          Cl⁻
         </div>
         <div id="anion-name" style="font-size: 1rem; color: #5b21b6;">
          Chloride
         </div>
        </div><!-- Counter Controls -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 1.5rem;"><button class="counter-btn" onclick="adjustAnion(-1)" style="width: 3rem; height: 3rem; background: #4c1d95; color: #ffffff; border: none; border-radius: 0.75rem; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;"> − </button>
         <div id="anion-count" style="font-size: 3rem; font-weight: 700; color: #4c1d95; min-width: 4rem; text-align: center;">
          1
         </div><button class="counter-btn" onclick="adjustAnion(1)" style="width: 3rem; height: 3rem; background: #4c1d95; color: #ffffff; border: none; border-radius: 0.75rem; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;"> + </button>
        </div>
       </div>
      </div><!-- Net Charge Display -->
      <div id="charge-display" style="background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; text-align: center;">
       <div id="net-charge-label" style="font-size: 1rem; font-weight: 600; color: #991b1b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem;">
        Net Charge
       </div>
       <div class="charge-badge" style="display: inline-flex; align-items: center; gap: 0.75rem;">
        <div id="net-charge-value" style="font-size: 3rem; font-weight: 700; color: #991b1b;">
         +1
        </div>
       </div>
      </div><!-- Formula Display -->
      <div id="formula-display" style="background: #f3f4f6; border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; text-align: center; display: none;">
       <div style="font-size: 1rem; font-weight: 600; color: #059669; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem;">
        ✓ Balanced Formula
       </div>
       <div id="balanced-formula" style="font-size: 3rem; font-weight: 700; color: #047857;">
        CaCl₂
       </div>
       <div id="compound-name" style="font-size: 1.5rem; font-weight: 500; color: #065f46; margin-top: 1rem;">
        Calcium Chloride
       </div>
      </div><!-- New Problem Button -->
      <div style="text-align: center;"><button id="new-problem-btn" onclick="generateNewProblem()" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #ffffff; border: none; border-radius: 0.75rem; padding: 1rem 2.5rem; font-size: 1.125rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: all 0.2s ease;"> New Problem </button>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      app_title: "Ionic Compound Balancer",
      instructions_text: "Adjust the quantities until the net charge equals zero",
      cation_label: "Cation",
      anion_label: "Anion",
      net_charge_label: "Net Charge",
      new_problem_button: "New Problem",
      background_color: "#1a1a2e",
      secondary_surface_color: "#ffffff",
      text_color: "#1f2937",
      primary_action_color: "#16213e",
      secondary_action_color: "#78350f",
      font_family: "Space Grotesk",
      font_size: 16
    };

    const ionPairs = [
      { cation: { formula: "Ca²⁺", name: "Calcium", charge: 2, isTransition: false }, anion: { formula: "Cl⁻", name: "Chloride", charge: -1 } },
      { cation: { formula: "Na⁺", name: "Sodium", charge: 1, isTransition: false }, anion: { formula: "O²⁻", name: "Oxide", charge: -2 } },
      { cation: { formula: "Al��⁺", name: "Aluminum", charge: 3, isTransition: false }, anion: { formula: "O²⁻", name: "Oxide", charge: -2 } },
      { cation: { formula: "Mg²⁺", name: "Magnesium", charge: 2, isTransition: false }, anion: { formula: "Br⁻", name: "Bromide", charge: -1 } },
      { cation: { formula: "Fe³⁺", name: "Iron", charge: 3, isTransition: true }, anion: { formula: "S²⁻", name: "Sulfide", charge: -2 } },
      { cation: { formula: "K⁺", name: "Potassium", charge: 1, isTransition: false }, anion: { formula: "SO���²⁻", name: "Sulfate", charge: -2 } },
      { cation: { formula: "NH₄⁺", name: "Ammonium", charge: 1, isTransition: false }, anion: { formula: "PO₄³⁻", name: "Phosphate", charge: -3 } },
      { cation: { formula: "Zn²⁺", name: "Zinc", charge: 2, isTransition: false }, anion: { formula: "NO₃⁻", name: "Nitrate", charge: -1 } },
      { cation: { formula: "Ca²⁺", name: "Calcium", charge: 2, isTransition: false }, anion: { formula: "NO₃⁻", name: "Nitrate", charge: -1 } },
      { cation: { formula: "Al³⁺", name: "Aluminum", charge: 3, isTransition: false }, anion: { formula: "SO₄²⁻", name: "Sulfate", charge: -2 } },
      { cation: { formula: "Na⁺", name: "Sodium", charge: 1, isTransition: false }, anion: { formula: "CO₃²⁻", name: "Carbonate", charge: -2 } },
      { cation: { formula: "Mg²⁺", name: "Magnesium", charge: 2, isTransition: false }, anion: { formula: "OH⁻", name: "Hydroxide", charge: -1 } },
      { cation: { formula: "Fe³⁺", name: "Iron", charge: 3, isTransition: true }, anion: { formula: "NO₃⁻", name: "Nitrate", charge: -1 } },
      { cation: { formula: "NH₄⁺", name: "Ammonium", charge: 1, isTransition: false }, anion: { formula: "SO₄²⁻", name: "Sulfate", charge: -2 } },
      { cation: { formula: "Cu²⁺", name: "Copper", charge: 2, isTransition: true }, anion: { formula: "CO₃²⁻", name: "Carbonate", charge: -2 } },
      { cation: { formula: "NH₄⁺", name: "Ammonium", charge: 1, isTransition: false }, anion: { formula: "OH⁻", name: "Hydroxide", charge: -1 } },
      { cation: { formula: "Ba²⁺", name: "Barium", charge: 2, isTransition: false }, anion: { formula: "NO₃⁻", name: "Nitrate", charge: -1 } },
      { cation: { formula: "Li⁺", name: "Lithium", charge: 1, isTransition: false }, anion: { formula: "CO₃²⁻", name: "Carbonate", charge: -2 } },
      { cation: { formula: "Al³⁺", name: "Aluminum", charge: 3, isTransition: false }, anion: { formula: "OH⁻", name: "Hydroxide", charge: -1 } },
      { cation: { formula: "NH₄⁺", name: "Ammonium", charge: 1, isTransition: false }, anion: { formula: "CO₃²⁻", name: "Carbonate", charge: -2 } }
    ];

    let currentPair = ionPairs[0];
    let cationCount = 1;
    let anionCount = 1;

    function adjustCation(delta) {
      cationCount = Math.max(1, Math.min(10, cationCount + delta));
      updateDisplay();
    }

    function adjustAnion(delta) {
      anionCount = Math.max(1, Math.min(10, anionCount + delta));
      updateDisplay();
    }

    function calculateNetCharge() {
      return (cationCount * currentPair.cation.charge) + (anionCount * currentPair.anion.charge);
    }

    function getFormulaString() {
      const cationSymbol = currentPair.cation.formula.replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/g, '').trim();
      const anionSymbol = currentPair.anion.formula.replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/g, '').trim();
      
      // Check if cation is polyatomic (more than one capital letter or contains subscripts)
      const cationIsPolyatomic = cationSymbol.length > 2 || /[₀₁₂₃₄₅₆₇₈₉]/.test(cationSymbol);
      
      let formula = '';
      
      // Add cation with brackets if polyatomic and count > 1
      if (cationIsPolyatomic && cationCount > 1) {
        formula += '(' + cationSymbol + ')' + convertToSubscript(cationCount);
      } else {
        formula += cationSymbol;
        if (cationCount > 1) {
          formula += convertToSubscript(cationCount);
        }
      }
      
      // Check if anion is polyatomic (contains multiple atoms - more than single element)
      const anionIsPolyatomic = anionSymbol.length > 1 && anionSymbol !== 'Cl' && anionSymbol !== 'Br' && anionSymbol !== 'I' && anionSymbol !== 'F';
      
      // Add anion with brackets if polyatomic and count > 1
      if (anionIsPolyatomic && anionCount > 1) {
        formula += '(' + anionSymbol + ')' + convertToSubscript(anionCount);
      } else {
        formula += anionSymbol;
        if (anionCount > 1) {
          formula += convertToSubscript(anionCount);
        }
      }
      
      return formula;
    }

    function convertToSubscript(num) {
      const subscripts = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
      return num.toString().split('').map(d => subscripts[d]).join('');
    }

    function getRomanNumeral(charge) {
      const romanNumerals = {
        1: 'I',
        2: 'II',
        3: 'III',
        4: 'IV',
        5: 'V',
        6: 'VI',
        7: 'VII'
      };
      return romanNumerals[charge] || charge.toString();
    }

    function getCompoundName() {
      let cationName = currentPair.cation.name;
      
      // Add Roman numeral for transition metals
      if (currentPair.cation.isTransition) {
        cationName += `(${getRomanNumeral(currentPair.cation.charge)})`;
      }
      
      return `${cationName} ${currentPair.anion.name}`;
    }

    function updateDisplay() {
      document.getElementById('cation-count').textContent = cationCount;
      document.getElementById('anion-count').textContent = anionCount;
      
      const netCharge = calculateNetCharge();
      const chargeDisplay = document.getElementById('charge-display');
      const chargeValue = document.getElementById('net-charge-value');
      const formulaDisplay = document.getElementById('formula-display');
      const balancedFormula = document.getElementById('balanced-formula');
      
      if (netCharge === 0) {
        chargeDisplay.style.background = 'linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%)';
        chargeValue.style.color = '#047857';
        chargeValue.textContent = '0';
        
        formulaDisplay.style.display = 'block';
        formulaDisplay.classList.add('success-animation');
        balancedFormula.textContent = getFormulaString();
        document.getElementById('compound-name').textContent = getCompoundName();
        
        setTimeout(() => {
          formulaDisplay.classList.remove('success-animation');
        }, 600);
      } else {
        chargeDisplay.style.background = 'linear-gradient(135deg, #fee2e2 0%, #fecaca 100%)';
        chargeValue.style.color = '#991b1b';
        chargeValue.textContent = netCharge > 0 ? `+${netCharge}` : netCharge;
        
        formulaDisplay.style.display = 'none';
      }
    }

    function generateNewProblem() {
      currentPair = ionPairs[Math.floor(Math.random() * ionPairs.length)];
      cationCount = 1;
      anionCount = 1;
      
      document.getElementById('cation-formula').textContent = currentPair.cation.formula;
      document.getElementById('cation-name').textContent = currentPair.cation.name;
      document.getElementById('anion-formula').textContent = currentPair.anion.formula;
      document.getElementById('anion-name').textContent = currentPair.anion.name;
      
      updateDisplay();
    }

    async function onConfigChange(config) {
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = 'system-ui, -apple-system, sans-serif';
      
      document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('app-title').style.fontSize = `${baseSize * 2.5}px`;
      document.getElementById('app-title').style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      document.getElementById('instructions').textContent = config.instructions_text || defaultConfig.instructions_text;
      document.getElementById('instructions').style.fontSize = `${baseSize * 1.125}px`;
      document.getElementById('instructions').style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      document.getElementById('cation-label').textContent = config.cation_label || defaultConfig.cation_label;
      document.getElementById('anion-label').textContent = config.anion_label || defaultConfig.anion_label;
      document.getElementById('net-charge-label').textContent = config.net_charge_label || defaultConfig.net_charge_label;
      document.getElementById('new-problem-btn').textContent = config.new_problem_button || defaultConfig.new_problem_button;
      
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const secondarySurfaceColor = config.secondary_surface_color || defaultConfig.secondary_surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryActionColor = config.primary_action_color || defaultConfig.primary_action_color;
      
      document.getElementById('app-wrapper').style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${primaryActionColor} 100%)`;
      document.querySelectorAll('.ion-card')[0].parentElement.parentElement.style.background = secondarySurfaceColor;
      document.getElementById('new-problem-btn').style.background = `linear-gradient(135deg, ${primaryActionColor} 0%, ${backgroundColor} 100%)`;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.secondary_surface_color || defaultConfig.secondary_surface_color,
              set: (value) => {
                config.secondary_surface_color = value;
                window.elementSdk.setConfig({ secondary_surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                window.elementSdk.setConfig({ primary_action_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["app_title", config.app_title || defaultConfig.app_title],
          ["instructions_text", config.instructions_text || defaultConfig.instructions_text],
          ["cation_label", config.cation_label || defaultConfig.cation_label],
          ["anion_label", config.anion_label || defaultConfig.anion_label],
          ["net_charge_label", config.net_charge_label || defaultConfig.net_charge_label],
          ["new_problem_button", config.new_problem_button || defaultConfig.new_problem_button]
        ])
      });
    }

    // Initialize display
    updateDisplay();
  </script>
