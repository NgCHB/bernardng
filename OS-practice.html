<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxidation State Practice</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .formula sub { font-size: 0.7em; vertical-align: sub; }
    .formula sup { font-size: 0.65em; vertical-align: super; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { transform: scale(0.95); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }
    .anim-slide { animation: slideUp 0.35s ease-out; }
    .anim-pop { animation: pop 0.3s ease-out; }
    .anim-shake { animation: shake 0.4s ease-out; }

    .hint-card {
      background: repeating-linear-gradient(135deg, transparent, transparent 8px, rgba(255,255,255,0.03) 8px, rgba(255,255,255,0.03) 16px);
    }

    input[type="text"]:focus { outline: none; }

    .progress-fill { transition: width 0.5s ease; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#1a1a2e',
            surface: '#16213e',
            accent: '#e94560',
            mint: '#0f3460',
            glow: '#53d8a8'
          }
        }
      }
    }
  </script>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-ink text-white overflow-auto">
  <div id="app" class="w-full h-full flex flex-col">
   <!-- Header -->
   <header class="w-full px-4 pt-5 pb-3 flex items-center justify-between">
    <div>
     <h1 id="app-title" class="text-lg font-bold tracking-tight text-white/90">Oxidation State Practice</h1>
     <p id="score-text" class="text-xs text-white/40 mt-0.5 mono">0 / 0 correct</p>
    </div><button id="reset-btn" class="w-9 h-9 rounded-full bg-surface flex items-center justify-center text-white/50 hover:text-white/80 transition-colors" aria-label="Reset progress"> <i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i> </button>
   </header><!-- Progress bar -->
   <div class="w-full px-4 mb-4">
    <div class="w-full h-1.5 rounded-full bg-surface overflow-hidden">
     <div id="progress-bar" class="progress-fill h-full rounded-full bg-gradient-to-r from-accent to-glow" style="width:0%"></div>
    </div>
    <p id="progress-label" class="text-[10px] text-white/30 mt-1 mono text-right">Question 1 of 15</p>
   </div><!-- Question Card -->
   <main class="flex-1 px-4 pb-4 flex flex-col">
    <div id="question-card" class="anim-slide bg-surface rounded-2xl p-5 flex-1 flex flex-col">
     <!-- Prompt -->
     <p class="text-white/50 text-xs font-medium uppercase tracking-widest mb-2">Find the oxidation state of</p>
     <div class="flex items-baseline gap-2 mb-1">
      <span id="target-element" class="text-3xl font-bold text-accent mono"></span> <span class="text-white/40 text-sm">in</span> <span id="compound-display" class="text-2xl font-bold text-white mono formula"></span>
     </div><!-- Answer input -->
     <div class="mt-5 flex items-center gap-3">
      <div class="flex-1 relative">
       <input id="answer-input" type="text" inputmode="numeric" placeholder="e.g. +3 or -2" class="w-full bg-ink/60 border-2 border-white/10 rounded-xl px-4 py-3 text-lg mono text-white placeholder-white/20 focus:border-accent transition-colors">
      </div><button id="submit-btn" class="h-12 px-5 rounded-xl bg-accent text-white font-semibold text-sm hover:bg-accent/80 active:scale-95 transition-all flex items-center gap-2"> Check </button>
     </div><!-- Feedback area -->
     <div id="feedback" class="mt-4 hidden">
      <div id="feedback-inner" class="rounded-xl px-4 py-3 flex items-start gap-3">
       <i id="feedback-icon" data-lucide="check-circle" style="width:20px;height:20px;flex-shrink:0;margin-top:2px;"></i>
       <div>
        <p id="feedback-text" class="text-sm font-semibold"></p>
        <p id="feedback-detail" class="text-xs mt-0.5 opacity-70"></p>
       </div>
      </div>
     </div><!-- Hint area -->
     <div class="mt-auto pt-4">
      <button id="hint-toggle" class="flex items-center gap-2 text-white/40 hover:text-white/60 text-xs font-medium transition-colors"> <i data-lucide="lightbulb" style="width:14px;height:14px;"></i> <span>Tap to reveal hint</span> </button>
      <div id="hint-content" class="hidden mt-3 hint-card border border-white/8 rounded-xl p-4 anim-slide">
       <div id="hint-rules" class="space-y-3"></div>
      </div>
     </div>
    </div><!-- Next button --> <button id="next-btn" class="hidden w-full mt-3 py-3.5 rounded-xl bg-mint text-white font-semibold text-sm hover:bg-mint/80 active:scale-[0.98] transition-all flex items-center justify-center gap-2"> Next Question <i data-lucide="arrow-right" style="width:16px;height:16px;"></i> </button>
   </main><!-- Completion overlay -->
   <div id="complete-overlay" class="hidden fixed inset-0 bg-ink/95 flex items-center justify-center z-50 p-6">
    <div class="text-center anim-pop">
     <div class="text-6xl mb-4">
      🎉
     </div>
     <h2 class="text-2xl font-bold mb-2">All Done!</h2>
     <p id="final-score" class="text-white/50 mono mb-6"></p><button id="restart-btn" class="px-8 py-3 rounded-xl bg-accent text-white font-semibold hover:bg-accent/80 transition-colors"> Practice Again </button>
    </div>
   </div>
  </div>
  <script>
const RULES = {
  1: { label: 'Rule 1 — Free Elements', text: 'Elements in their free (uncombined) state have an oxidation state of 0.' },
  2: { label: 'Rule 2 — Monatomic Ions', text: 'The oxidation state of a monatomic ion is equal to its charge.' },
  3: { label: 'Rule 3 — Fixed Oxidation States', text: 'Hydrogen is usually +1. Oxygen is usually −2. Group 1 elements = +1, Group 2 elements = +2.' },
  4: { label: 'Rule 4 — Neutral Compounds', text: 'In a neutral compound, the sum of all oxidation states is 0.' },
  5: { label: 'Rule 5 — Polyatomic Ions', text: 'In a polyatomic ion, the sum of all oxidation states equals the overall charge of the ion.' }
};

const QUESTIONS = [
  { compound: 'Fe', display: 'Fe', target: 'Fe', answer: 0, rules: [1], explanation: 'Fe is in its free elemental state.' },
  { compound: 'O2', display: 'O<sub>2</sub>', target: 'O', answer: 0, rules: [1], explanation: 'O₂ is a free element.' },
  { compound: 'Cl2', display: 'Cl<sub>2</sub>', target: 'Cl', answer: 0, rules: [1], explanation: 'Cl₂ is in its free elemental state.' },
  { compound: 'Na+', display: 'Na<sup>+</sup>', target: 'Na', answer: 1, rules: [2], explanation: 'Na⁺ is a monatomic ion with +1 charge.' },
  { compound: 'Cl-', display: 'Cl<sup>−</sup>', target: 'Cl', answer: -1, rules: [2], explanation: 'Cl⁻ is a monatomic ion with −1 charge.' },
  { compound: 'Ca2+', display: 'Ca<sup>2+</sup>', target: 'Ca', answer: 2, rules: [2], explanation: 'Ca²⁺ is a monatomic ion with +2 charge.' },
  { compound: 'H2O', display: 'H<sub>2</sub>O', target: 'H', answer: 1, rules: [3,4], explanation: 'H is usually +1. Check: 2(+1) + (−2) = 0 ✓' },
  { compound: 'H2O', display: 'H<sub>2</sub>O', target: 'O', answer: -2, rules: [3], explanation: 'Oxygen is usually −2 in compounds.' },
  { compound: 'MgCl2', display: 'MgCl<sub>2</sub>', target: 'Mg', answer: 2, rules: [3], explanation: 'Mg is a Group 2 element: always +2.' },
  { compound: 'K2S', display: 'K<sub>2</sub>S', target: 'K', answer: 1, rules: [3,4], explanation: 'K is Group 1: always +1. Check: 2(+1) + (−2) = 0 ✓' },
  { compound: 'NaH', display: 'NaH', target: 'H', answer: -1, rules: [3,4], explanation: 'NaH is a metal hydride — H is −1 (exception to usual +1).' },
  { compound: 'CaH2', display: 'CaH<sub>2</sub>', target: 'H', answer: -1, rules: [3,4], explanation: 'CaH₂ is a metal hydride — H is −1, not +1.' },
  { compound: 'H2O2', display: 'H<sub>2</sub>O<sub>2</sub>', target: 'O', answer: -1, rules: [3,4], explanation: 'H₂O₂ is a peroxide — O is −1 (exception to usual −2).' },
  { compound: 'H2O2', display: 'H<sub>2</sub>O<sub>2</sub>', target: 'H', answer: 1, rules: [3,4], explanation: 'H is still +1 in peroxides. Check: 2(+1) + 2(−1) = 0 ✓' },
  { compound: 'H2SO4', display: 'H<sub>2</sub>SO<sub>4</sub>', target: 'S', answer: 6, rules: [3,4], explanation: '2(+1) + S + 4(−2) = 0 → S = +6' },
  { compound: 'KMnO4', display: 'KMnO<sub>4</sub>', target: 'Mn', answer: 7, rules: [3,4], explanation: '(+1) + Mn + 4(−2) = 0 → Mn = +7' },
  { compound: 'SO4^2-', display: 'SO<sub>4</sub><sup>2−</sup>', target: 'S', answer: 6, rules: [3,5], explanation: 'S + 4(−2) = −2 → S = +6' },
  { compound: 'NO3^-', display: 'NO<sub>3</sub><sup>−</sup>', target: 'N', answer: 5, rules: [3,5], explanation: 'N + 3(−2) = −1 → N = +5' },
  { compound: 'Cr2O7^2-', display: 'Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>', target: 'Cr', answer: 6, rules: [3,5], explanation: '2Cr + 7(−2) = −2 → Cr = +6' },
  { compound: 'NH4^+', display: 'NH<sub>4</sub><sup>+</sup>', target: 'N', answer: -3, rules: [3,5], explanation: 'N + 4(+1) = +1 → N = −3' }
];

let questions = [];
let current = 0;
let correct = 0;
let answered = 0;
let hintRevealed = false;
let currentAnswered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function formatAnswer(n) { return n > 0 ? `+${n}` : `${n}`; }

function parseAnswer(str) {
  const s = str.trim().replace('−', '-').replace('–', '-');
  if (s === '0') return 0;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function loadQuestion() {
  const q = questions[current];
  currentAnswered = false;
  hintRevealed = false;

  document.getElementById('target-element').textContent = q.target;
  document.getElementById('compound-display').innerHTML = q.display;
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('answer-input').className = 'w-full bg-ink/60 border-2 border-white/10 rounded-xl px-4 py-3 text-lg mono text-white placeholder-white/20 focus:border-accent transition-colors';
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('flex');
  document.getElementById('hint-content').classList.add('hidden');
  document.getElementById('hint-toggle').querySelector('span').textContent = 'Tap to reveal hint';
  document.getElementById('submit-btn').classList.remove('hidden');

  // Build hint rules
  const rulesContainer = document.getElementById('hint-rules');
  rulesContainer.innerHTML = '';
  
  // Add rules heading
  const rulesHeading = document.createElement('div');
  rulesHeading.className = 'mb-3';
  rulesHeading.innerHTML = '<p class="text-[10px] uppercase tracking-widest text-white/60 font-semibold">Relevant Rules:</p>';
  rulesContainer.appendChild(rulesHeading);
  
  q.rules.forEach(ruleId => {
    const rule = RULES[ruleId];
    const ruleEl = document.createElement('div');
    ruleEl.className = 'border-l-2 border-glow/40 pl-3 mb-2';
    ruleEl.innerHTML = `
      <p class="text-[10px] uppercase tracking-widest text-glow/80 font-semibold mb-0.5">${rule.label}</p>
      <p class="text-sm text-white/60 leading-relaxed">${rule.text}</p>
    `;
    rulesContainer.appendChild(ruleEl);
  });
  
  // Add working section
  const workingHeading = document.createElement('div');
  workingHeading.className = 'mt-4 pt-3 border-t border-white/10';
  workingHeading.innerHTML = '<p class="text-[10px] uppercase tracking-widest text-white/60 font-semibold mb-2">Working:</p>';
  rulesContainer.appendChild(workingHeading);
  
  const workingEl = document.createElement('div');
  workingEl.className = 'border-l-2 border-mint/40 pl-3 mb-2';
  workingEl.innerHTML = `<p class="text-sm text-white/60 leading-relaxed font-mono">${q.explanation}</p>`;
  rulesContainer.appendChild(workingEl);

  document.getElementById('progress-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('progress-bar').style.width = `${(current / questions.length) * 100}%`;

  const card = document.getElementById('question-card');
  card.classList.remove('anim-slide');
  void card.offsetWidth;
  card.classList.add('anim-slide');

  document.getElementById('answer-input').focus();
}

function checkAnswer() {
  if (currentAnswered) return;
  const q = questions[current];
  const userVal = parseAnswer(document.getElementById('answer-input').value);
  if (userVal === null) {
    document.getElementById('answer-input').classList.add('anim-shake');
    setTimeout(() => document.getElementById('answer-input').classList.remove('anim-shake'), 400);
    return;
  }

  currentAnswered = true;
  answered++;
  const isCorrect = userVal === q.answer;
  if (isCorrect) correct++;

  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-btn').classList.add('hidden');

  const fb = document.getElementById('feedback');
  const inner = document.getElementById('feedback-inner');
  const icon = document.getElementById('feedback-icon');
  const text = document.getElementById('feedback-text');
  const detail = document.getElementById('feedback-detail');

  fb.classList.remove('hidden');
  fb.classList.add('anim-pop');
  setTimeout(() => fb.classList.remove('anim-pop'), 300);

  if (isCorrect) {
    inner.className = 'rounded-xl px-4 py-3 flex items-start gap-3 bg-glow/15 border border-glow/20';
    icon.setAttribute('data-lucide', 'check-circle');
    icon.style.color = '#53d8a8';
    text.textContent = 'Correct!';
    text.style.color = '#53d8a8';
    document.getElementById('answer-input').className = 'w-full bg-ink/60 border-2 border-glow/50 rounded-xl px-4 py-3 text-lg mono text-glow placeholder-white/20 transition-colors';
  } else {
    inner.className = 'rounded-xl px-4 py-3 flex items-start gap-3 bg-accent/15 border border-accent/20';
    icon.setAttribute('data-lucide', 'x-circle');
    icon.style.color = '#e94560';
    text.textContent = `The answer is ${formatAnswer(q.answer)}`;
    text.style.color = '#e94560';
    document.getElementById('answer-input').className = 'w-full bg-ink/60 border-2 border-accent/50 rounded-xl px-4 py-3 text-lg mono text-accent placeholder-white/20 transition-colors';
  }
  detail.textContent = q.explanation;
  lucide.createIcons();

  document.getElementById('score-text').textContent = `${correct} / ${answered} correct`;

  const next = document.getElementById('next-btn');
  next.classList.remove('hidden');
  next.classList.add('flex');
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('final-score').textContent = `You got ${correct} out of ${questions.length} correct`;
    document.getElementById('complete-overlay').classList.remove('hidden');
    return;
  }
  loadQuestion();
}

function resetAll() {
  current = 0; correct = 0; answered = 0;
  questions = shuffle(QUESTIONS);
  document.getElementById('score-text').textContent = '0 / 0 correct';
  document.getElementById('complete-overlay').classList.add('hidden');
  loadQuestion();
}

// Events
document.getElementById('submit-btn').addEventListener('click', checkAnswer);
document.getElementById('answer-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (currentAnswered) nextQuestion(); else checkAnswer(); } });
document.getElementById('next-btn').addEventListener('click', nextQuestion);
document.getElementById('reset-btn').addEventListener('click', resetAll);
document.getElementById('restart-btn').addEventListener('click', resetAll);
document.getElementById('hint-toggle').addEventListener('click', () => {
  hintRevealed = !hintRevealed;
  document.getElementById('hint-content').classList.toggle('hidden', !hintRevealed);
  document.getElementById('hint-toggle').querySelector('span').textContent = hintRevealed ? 'Hide hint' : 'Tap to reveal hint';
});

// Element SDK
const defaultConfig = {
  app_title: 'Oxidation State Practice',
  background_color: '#1a1a2e',
  surface_color: '#16213e',
  text_color: '#ffffff',
  accent_color: '#e94560',
  glow_color: '#53d8a8',
  font_family: 'DM Sans',
  font_size: 16
};

function applyConfig(config) {
  const c = { ...defaultConfig, ...config };
  document.getElementById('app-title').textContent = c.app_title;
  document.body.style.backgroundColor = c.background_color;
  document.body.style.fontFamily = `${c.font_family}, sans-serif`;
  document.body.style.color = c.text_color;

  document.querySelectorAll('.bg-surface').forEach(el => el.style.backgroundColor = c.surface_color);

  const base = c.font_size;
  document.getElementById('app-title').style.fontSize = `${base * 1.125}px`;
  document.getElementById('target-element').style.fontSize = `${base * 1.875}px`;
  document.getElementById('compound-display').style.fontSize = `${base * 1.5}px`;
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
      { get: () => config.glow_color || defaultConfig.glow_color, set: (v) => { config.glow_color = v; window.elementSdk.setConfig({ glow_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ['app_title', config.app_title || defaultConfig.app_title]
  ])
});

// Init
questions = shuffle(QUESTIONS);
loadQuestion();
lucide.createIcons();
</script>
