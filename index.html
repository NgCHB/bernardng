<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Apps Catalogue</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sora', sans-serif; }
    
    .app-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .app-card:hover {
      transform: translateY(-8px) scale(1.02);
    }
    
    .app-card:hover .thumbnail-overlay {
      opacity: 1;
    }
    
    .app-card:hover .app-icon {
      transform: scale(1.1);
    }
    
    .thumbnail {
      position: relative;
      overflow: hidden;
    }
    
    .thumbnail-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.15;
    }
    
    .thumbnail-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .app-icon {
      transition: transform 0.3s ease;
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .hero-bg {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
    }
    
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-in {
      animation: fadeInUp 0.6s ease forwards;
    }
    
    .category-pill {
      transition: all 0.3s ease;
    }
    
    .category-pill:hover {
      transform: scale(1.05);
    }
    
    .category-pill.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-950 text-white overflow-auto">
  <div class="min-h-full"><!-- Hero Section -->
   <header class="hero-bg relative overflow-hidden py-16 px-6"><!-- Floating Shapes -->
    <div class="floating-shape w-64 h-64 bg-purple-500 -top-20 -left-20" style="animation-delay: 0s;"></div>
    <div class="floating-shape w-48 h-48 bg-indigo-500 top-10 right-10" style="animation-delay: 2s;"></div>
    <div class="floating-shape w-32 h-32 bg-pink-500 bottom-0 left-1/3" style="animation-delay: 4s;"></div>
    <div class="max-w-6xl mx-auto relative z-10">
     <nav class="flex items-center justify-between mb-12">
      <div class="flex items-center gap-3">
       <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-6 h-6"></i>
       </div><span class="text-xl font-semibold">BernardNg</span>
      </div>
      <div class="flex items-center gap-6"><a href="#categories" class="text-slate-300 hover:text-white transition-colors">Categories</a> <button class="px-4 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition-colors"> <i data-lucide="search" class="w-5 h-5"></i> </button>
      </div>
     </nav>
     <div class="text-center max-w-3xl mx-auto">
      <h1 id="page-title" class="text-5xl md:text-6xl font-bold mb-6 leading-tight">Discover <span class="gradient-text">Learning Apps</span> That Inspire</h1>
     </div>
    </div>
   </header><!-- Categories Section -->
   <section id="categories" class="py-12 px-6 bg-slate-900/50">
    <div class="max-w-6xl mx-auto">
     <div class="flex flex-wrap items-center justify-center gap-3" id="category-filters"><button class="category-pill active px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="all"> All Apps </button> <button class="category-pill px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="math"> <i data-lucide="calculator" class="w-4 h-4 inline mr-1"></i> Mathematics </button> <button class="category-pill px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="science"> <i data-lucide="flask-conical" class="w-4 h-4 inline mr-1"></i> Science </button> <button class="category-pill px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="language"> <i data-lucide="languages" class="w-4 h-4 inline mr-1"></i> Languages </button> <button class="category-pill px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="coding"> <i data-lucide="code-2" class="w-4 h-4 inline mr-1"></i> Coding </button> <button class="category-pill px-5 py-2 rounded-full bg-white/10 font-medium text-sm" data-category="music"> <i data-lucide="music" class="w-4 h-4 inline mr-1"></i> Music </button>
     </div>
    </div>
   </section><!-- Apps Grid -->
   <main id="apps" class="py-16 px-6">
    <div class="max-w-6xl mx-auto">
     <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"><!-- Apps will be dynamically generated -->
     </div>
    </div>
   </main><!-- Footer -->
   <footer class="py-12 px-6 bg-slate-900/80 border-t border-white/5">
    <div class="max-w-6xl mx-auto text-center">
     <div class="flex items-center justify-center gap-3 mb-4">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5"></i>
      </div><span class="text-lg font-semibold">LearnHub</span>
     </div>
     <p class="text-slate-400 text-sm">© 2024 LearnHub. Empowering learners worldwide.</p>
    </div>
   </footer>
  </div>
  <script>
    // Learning Apps Data
    const learningApps = [
      {
        id: 1,
        name: "Metal Displacement",
        description: "Interactive math challenges and puzzles",
        category: "Reactivity Series",
        icon: "flask-conical",
        colors: ["#6366f1", "#8b5cf6"],
        pattern: "circles",
        link: "/bernardng/reactivityseriesgame.html"
      },
      {

        name: "Science Lab",
        description: "Virtual experiments and simulations",
        category: "science",
        icon: "flask-conical",

      },
      {

        name: "Word Wizard",
        description: "Vocabulary building and spelling games",
        category: "language",
        icon: "book-open",

        link: "/apps/word-wizard"
      },
      {
        id: 4,

      },
      {
        id: 5,
        name: "Rhythm Master",
        description: "Music theory and beat creation",
        category: "music",
        icon: "music",
        colors: ["#ec4899", "#f43f5e"],
        pattern: "notes",
        link: "/apps/rhythm-master"
      },
      {
        id: 6,
        name: "Geometry World",
        description: "Explore shapes and spatial reasoning",
        category: "math",
        icon: "hexagon",
        colors: ["#8b5cf6", "#a855f7"],
        pattern: "shapes",
        link: "/apps/geometry-world"
      },
      {
        id: 7,
        name: "Chemistry Lab",
        description: "Molecular structures and reactions",
        category: "science",
        icon: "atom",
        colors: ["#06b6d4", "#22d3ee"],
        pattern: "atoms",
        link: "/apps/chemistry-lab"
      },
      {
        id: 8,
        name: "Language Bridge",
        description: "Learn new languages interactively",
        category: "language",
        icon: "languages",
        colors: ["#84cc16", "#a3e635"],
        pattern: "flags",
        link: "/apps/language-bridge"
      },
      {
        id: 9,
        name: "Algorithm Arena",
        description: "Master coding algorithms step by step",
        category: "coding",
        icon: "terminal",
        colors: ["#475569", "#64748b"],
        pattern: "binary",
        link: "/apps/algorithm-arena"
      },
      {
        id: 10,
        name: "Piano Keys",
        description: "Learn piano with visual guides",
        category: "music",
        icon: "piano",
        colors: ["#7c3aed", "#9333ea"],
        pattern: "keys",
        link: "/apps/piano-keys"
      },
      {
        id: 11,
        name: "Fraction Fun",
        description: "Visual fraction learning tools",
        category: "math",
        icon: "divide",
        colors: ["#0891b2", "#06b6d4"],
        pattern: "fractions",
        link: "/apps/fraction-fun"
      },
      {
        id: 12,
        name: "Space Explorer",
        description: "Journey through the solar system",
        category: "science",
        icon: "rocket",
        colors: ["#1e3a5f", "#3b5998"],
        pattern: "stars",
        link: "/apps/space-explorer"
      }
    ];

    // Generate SVG pattern for thumbnail
    function generatePattern(pattern, colors) {
      const patterns = {
        circles: `
          <circle cx="20" cy="20" r="15" fill="${colors[1]}" opacity="0.3"/>
          <circle cx="60" cy="60" r="20" fill="${colors[0]}" opacity="0.4"/>
          <circle cx="100" cy="30" r="12" fill="${colors[1]}" opacity="0.3"/>
          <circle cx="40" cy="90" r="18" fill="${colors[0]}" opacity="0.25"/>
        `,
        molecules: `
          <circle cx="30" cy="30" r="8" fill="${colors[1]}" opacity="0.4"/>
          <circle cx="70" cy="50" r="10" fill="${colors[0]}" opacity="0.5"/>
          <circle cx="50" cy="80" r="6" fill="${colors[1]}" opacity="0.3"/>
          <line x1="30" y1="30" x2="70" y2="50" stroke="${colors[0]}" stroke-width="2" opacity="0.3"/>
          <line x1="70" y1="50" x2="50" y2="80" stroke="${colors[1]}" stroke-width="2" opacity="0.3"/>
        `,
        letters: `
          <text x="20" y="40" font-size="30" fill="${colors[1]}" opacity="0.3" font-weight="bold">A</text>
          <text x="60" y="70" font-size="24" fill="${colors[0]}" opacity="0.4" font-weight="bold">B</text>
          <text x="90" y="45" font-size="20" fill="${colors[1]}" opacity="0.25" font-weight="bold">C</text>
        `,
        brackets: `
          <text x="15" y="50" font-size="40" fill="${colors[1]}" opacity="0.3" font-family="monospace">{</text>
          <text x="55" y="60" font-size="30" fill="${colors[0]}" opacity="0.4" font-family="monospace">/</text>
          <text x="85" y="50" font-size="40" fill="${colors[1]}" opacity="0.3" font-family="monospace">}</text>
        `,
        notes: `
          <text x="20" y="45" font-size="35" fill="${colors[1]}" opacity="0.4">♪</text>
          <text x="55" y="65" font-size="28" fill="${colors[0]}" opacity="0.5">♫</text>
          <text x="85" y="40" font-size="22" fill="${colors[1]}" opacity="0.3">♬</text>
        `,
        shapes: `
          <polygon points="30,10 50,40 10,40" fill="${colors[1]}" opacity="0.3"/>
          <rect x="60" y="50" width="30" height="30" fill="${colors[0]}" opacity="0.4"/>
          <circle cx="90" cy="25" r="15" fill="${colors[1]}" opacity="0.25"/>
        `,
        atoms: `
          <circle cx="60" cy="50" r="8" fill="${colors[0]}" opacity="0.5"/>
          <ellipse cx="60" cy="50" rx="35" ry="15" fill="none" stroke="${colors[1]}" stroke-width="2" opacity="0.3" transform="rotate(0 60 50)"/>
          <ellipse cx="60" cy="50" rx="35" ry="15" fill="none" stroke="${colors[0]}" stroke-width="2" opacity="0.3" transform="rotate(60 60 50)"/>
          <ellipse cx="60" cy="50" rx="35" ry="15" fill="none" stroke="${colors[1]}" stroke-width="2" opacity="0.3" transform="rotate(120 60 50)"/>
        `,
        flags: `
          <rect x="20" y="20" width="25" height="15" fill="${colors[1]}" opacity="0.4" rx="2"/>
          <rect x="55" y="45" width="30" height="18" fill="${colors[0]}" opacity="0.5" rx="2"/>
          <rect x="80" y="70" width="22" height="13" fill="${colors[1]}" opacity="0.3" rx="2"/>
        `,
        binary: `
          <text x="10" y="30" font-size="14" fill="${colors[1]}" opacity="0.3" font-family="monospace">101</text>
          <text x="50" y="55" font-size="16" fill="${colors[0]}" opacity="0.4" font-family="monospace">010</text>
          <text x="25" y="80" font-size="12" fill="${colors[1]}" opacity="0.25" font-family="monospace">110</text>
        `,
        keys: `
          <rect x="20" y="30" width="12" height="50" fill="${colors[1]}" opacity="0.3" rx="2"/>
          <rect x="40" y="30" width="12" height="50" fill="${colors[0]}" opacity="0.4" rx="2"/>
          <rect x="60" y="30" width="12" height="50" fill="${colors[1]}" opacity="0.35" rx="2"/>
          <rect x="80" y="30" width="12" height="50" fill="${colors[0]}" opacity="0.3" rx="2"/>
        `,
        fractions: `
          <text x="30" y="45" font-size="20" fill="${colors[1]}" opacity="0.4">½</text>
          <text x="60" y="65" font-size="24" fill="${colors[0]}" opacity="0.5">¼</text>
          <text x="85" y="40" font-size="18" fill="${colors[1]}" opacity="0.3">¾</text>
        `,
        stars: `
          <text x="20" y="35" font-size="20" fill="${colors[1]}" opacity="0.4">★</text>
          <text x="55" y="60" font-size="28" fill="${colors[0]}" opacity="0.5">✦</text>
          <text x="85" y="40" font-size="16" fill="${colors[1]}" opacity="0.3">★</text>
          <circle cx="40" cy="75" r="3" fill="${colors[0]}" opacity="0.4"/>
          <circle cx="95" cy="70" r="2" fill="${colors[1]}" opacity="0.3"/>
        `
      };
      return patterns[pattern] || patterns.circles;
    }

    // Create app card
    function createAppCard(app, index) {
      const card = document.createElement('a');
      card.href = app.link;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.className = 'app-card block rounded-2xl overflow-hidden bg-slate-800/50 border border-white/5 cursor-pointer animate-fade-in';
      card.style.animationDelay = `${index * 0.1}s`;
      card.style.opacity = '0';
      card.dataset.category = app.category;
      
      card.innerHTML = `
        <div class="thumbnail h-40 relative" style="background: linear-gradient(135deg, ${app.colors[0]} 0%, ${app.colors[1]} 100%);">
          <svg class="thumbnail-pattern w-full h-full" viewBox="0 0 120 100" preserveAspectRatio="xMidYMid slice">
            ${generatePattern(app.pattern, app.colors)}
          </svg>
          <div class="thumbnail-overlay"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="app-icon w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center">
              <i data-lucide="${app.icon}" class="w-8 h-8 text-white"></i>
            </div>
          </div>
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-lg mb-1">${app.name}</h3>
          <p class="text-slate-400 text-sm mb-3">${app.description}</p>
          <div class="flex items-center justify-between">
            <span class="text-xs px-3 py-1 rounded-full bg-white/10 capitalize">${app.category}</span>
            <span class="text-indigo-400 text-sm flex items-center gap-1">
              Open <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </span>
          </div>
        </div>
      `;
      
      return card;
    }

    // Render apps
    function renderApps(category = 'all') {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = '';
      
      const filteredApps = category === 'all' 
        ? learningApps 
        : learningApps.filter(app => app.category === category);
      
      filteredApps.forEach((app, index) => {
        grid.appendChild(createAppCard(app, index));
      });
      
      lucide.createIcons();
    }

    // Category filter handling
    document.getElementById('category-filters').addEventListener('click', (e) => {
      const pill = e.target.closest('.category-pill');
      if (!pill) return;
      
      document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      
      renderApps(pill.dataset.category);
    });

    // Default config
    const defaultConfig = {
      page_title: "Discover Learning Apps That Inspire",
      page_subtitle: "Explore our curated collection of interactive educational tools designed to make learning engaging and effective.",
      background_color: "#0f172a",
      card_color: "#1e293b",
      text_color: "#f8fafc",
      primary_color: "#6366f1",
      accent_color: "#a855f7"
    };

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          const title = config.page_title || defaultConfig.page_title;
          const subtitle = config.page_subtitle || defaultConfig.page_subtitle;
          const bgColor = config.background_color || defaultConfig.background_color;
          const cardColor = config.card_color || defaultConfig.card_color;
          const textColor = config.text_color || defaultConfig.text_color;
          const primaryColor = config.primary_color || defaultConfig.primary_color;
          const accentColor = config.accent_color || defaultConfig.accent_color;
          
          document.getElementById('page-title').innerHTML = title.includes('Learning Apps') 
            ? title.replace('Learning Apps', '<span class="gradient-text">Learning Apps</span>')
            : title;
          document.getElementById('page-subtitle').textContent = subtitle;
          
          document.body.style.backgroundColor = bgColor;
          document.querySelectorAll('.app-card').forEach(card => {
            card.style.backgroundColor = cardColor;
          });
          document.body.style.color = textColor;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => { config.card_color = value; window.elementSdk.setConfig({ card_color: value }); }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
            },
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => { config.primary_color = value; window.elementSdk.setConfig({ primary_color: value }); }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => { config.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["page_title", config.page_title || defaultConfig.page_title],
          ["page_subtitle", config.page_subtitle || defaultConfig.page_subtitle]
        ])
      });
    }

    // Initial render
    renderApps();
    lucide.createIcons();
  </script>
