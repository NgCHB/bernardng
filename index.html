<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Apps Catalogue</title>
  <link rel="icon" type="image/png" href="/bernardng/favicon2.jpg">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --text: #1c1917;
      --muted: #6b6560;
      --line: #e7e5e4;
      --line-strong: #c9c5c1;
      --accent: #0f766e;
      --accent-soft: #e6f4f2;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131211;
        --surface: #1b1a19;
        --text: #f3f1ee;
        --muted: #a39d97;
        --line: #2b2927;
        --line-strong: #47433f;
        --accent: #5eead4;
        --accent-soft: #16302d;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .site-head { padding: 28px 0 0; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .brand svg { width: 18px; height: 18px; color: var(--accent); }
    .hero { padding: 56px 0 32px; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .subtitle { margin: 0; max-width: 52ch; color: var(--muted); font-size: 16px; }

    /* Controls */
    .controls { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
    .search { position: relative; flex: 1 1 260px; max-width: 420px; }
    .search svg { position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:hover { border-color: var(--line-strong); }
    .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

    /* Sort toggle */
    .sort { display: inline-flex; align-items: center; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    .sort-label { padding: 0 8px 0 10px; font-size: 13px; color: var(--muted); }
    .sort button {
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      transition: color .15s, background-color .15s;
    }
    .sort button:hover { color: var(--text); }
    .sort button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background-color .15s;
    }
    .chip:hover { color: var(--text); border-color: var(--line-strong); }
    .chip[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-weight: 500; }

    .count { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

    /* Grid */
    .results { padding-bottom: 72px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .group + .group { margin-top: 32px; }
    .group-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .group-title span { font-weight: 400; letter-spacing: 0; text-transform: none; }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .tile {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .tile svg { width: 20px; height: 20px; }
    .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.35; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .card-foot svg { width: 16px; height: 16px; transition: transform .15s, color .15s; }
    .card:hover .card-foot svg { color: var(--accent); transform: translate(2px, -2px); }

    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .empty button { margin-top: 8px; padding: 0; font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; }

    /* Footer */
    footer { padding: 24px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    @media (max-width: 520px) {
      .wrap { padding: 0 18px; }
      .hero { padding: 40px 0 24px; }
      .search { max-width: none; }
    }
  </style>
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <span class="brand"><i data-lucide="graduation-cap"></i>BernardNg</span>
      <div class="hero">
        <h1 id="page-title">Learning Apps</h1>
        <p class="subtitle" id="page-subtitle">Games, simulators and practice tools for chemistry revision.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <div class="row">
        <label class="search">
          <i data-lucide="search"></i>
          <input id="search" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off">
        </label>
        <div class="sort" id="sort" role="group" aria-label="Sort apps">
          <span class="sort-label">Sort</span>
          <button type="button" data-sort="newest" aria-pressed="true">Newest first</button>
          <button type="button" data-sort="topic" aria-pressed="false">By topic</button>
        </div>
      </div>
      <div class="filters" id="category-filters" role="group" aria-label="Filter by topic"></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="results" id="apps-grid"></div>
  </main>

  <footer>
    <div class="wrap">© 2026 BernardNg</div>
  </footer>

  <script>
    // To add an app: copy one block, give it the next id (a higher id = newer), then set name, description, category, icon, colour and link.
    // Apps are listed newest first (highest id first). Topic filters are built automatically from the categories used here.
    const learningApps = [
      { id: 1,  name: "Metal Displacement", description: "Game to revise the reactivity series", category: "reactivity series", icon: "atom", color: "#6366f1", link: "/bernardng/metaldisplacement.html" },
      { id: 2,  name: "Punch-kun | QA", description: "Game to revise qualitative analysis", category: "QA", icon: "test-tube", color: "#10b981", link: "/bernardng/punchkun-QA.html" },
      { id: 3,  name: "Punch-kun | Redox", description: "Game to revise oxidation and reduction", category: "redox", icon: "beaker", color: "#f59e0b", link: "/bernardng/punchkun-redox.html" },
      { id: 4,  name: "Chemical Calculations Trainer", description: "3C Method: step by step", category: "chem-calc", icon: "calculator", color: "#3b82f6", link: "/bernardng/chemcaltrainer.html" },
      { id: 5,  name: "QA Simulator", description: "Simulation for cation tests", category: "QA", icon: "test-tube", color: "#ec4899", link: "/bernardng/qa-sim.html" },
      { id: 6,  name: "Redox Blaster", description: "Game to revise oxidation states", category: "redox", icon: "hexagon", color: "#8b5cf6", link: "/bernardng/redoxblaster.html" },
      { id: 7,  name: "Redox OS Buddy Challenge", description: "2-player game to revise oxidation states", category: "redox", icon: "atom", color: "#06b6d4", link: "/bernardng/redoxbuddy.html" },
      { id: 8,  name: "Bonding - Structure", description: "Game to revise the structure of substances", category: "bonding", icon: "atom", color: "#65a30d", link: "/bernardng/bonding-structure.html" },
      { id: 9,  name: "Ionic Formulae", description: "Make sense of the formulae of ionic compounds", category: "bonding", icon: "atom", color: "#64748b", link: "/bernardng/bonding-ionicformulae.html" },
      { id: 10, name: "Breathing for Calmness", description: "Visual guide for box breathing", category: "wellness", icon: "wind", color: "#7c3aed", link: "/bernardng/boxbreathing.html" },
      { id: 11, name: "Oxidation State Practice", description: "Practise calculating oxidation states", category: "redox", icon: "divide", color: "#0891b2", link: "/bernardng/OS-practice.html" },
      { id: 12, name: "Electrolysis", description: "Case studies", category: "Electrochemistry", icon: "zap", color: "#3b5998", link: "/bernardng/electrolysis.html" },
      { id: 13, name: "Structure & Properties", description: "Visualisation", category: "Bonding", icon: "box", color: "#3b5998", link: "/bernardng/structure.html" },
      { id: 14, name: "World Cup 2026 | Solubility", description: "Game to revise solubility rules", category: "Salts", icon: "ball", color: "#3b5998", link: "/bernardng/wc26solubility.html" }
    ];

    // Display names for topics (falls back to the raw category if not listed)
    const categoryLabels = {

    };
    const labelFor = c => categoryLabels[c] || c;

    const results = document.getElementById('apps-grid');
    const filters = document.getElementById('category-filters');
    const sortEl = document.getElementById('sort');
    const searchInput = document.getElementById('search');
    const countEl = document.getElementById('count');
    let activeCategory = 'all';
    let sortMode = 'newest';

    // Newest first: highest id at the top
    const newestFirst = (a, b) => b.id - a.id;

    function buildFilters() {
      const categories = ['all', ...new Set(learningApps.map(a => a.category))];
      filters.innerHTML = categories.map(c =>
        `<button type="button" class="chip" data-category="${c}" aria-pressed="${c === activeCategory}">${c === 'all' ? 'All' : labelFor(c)}</button>`
      ).join('');
    }

    function cardHTML(app) {
      return `
        <a class="card" href="${app.link}" target="_blank" rel="noopener noreferrer">
          <span class="tile" style="background:${app.color}1f;color:${app.color}"><i data-lucide="${app.icon}"></i></span>
          <div>
            <h2>${app.name}</h2>
            <p>${app.description}</p>
          </div>
          <span class="card-foot">${labelFor(app.category)}<i data-lucide="arrow-up-right"></i></span>
        </a>`;
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const list = learningApps
        .filter(app =>
          (activeCategory === 'all' || app.category === activeCategory) &&
          (!q || `${app.name} ${app.description} ${labelFor(app.category)}`.toLowerCase().includes(q))
        )
        .sort(newestFirst);

      countEl.textContent = `${list.length} ${list.length === 1 ? 'app' : 'apps'}`;

      if (!list.length) {
        results.innerHTML = `<div class="empty">No apps match your search.<br><button type="button" id="clear">Clear filters</button></div>`;
      } else if (sortMode === 'topic') {
        // Group by topic (A to Z); within each topic, newest first
        const groups = {};
        list.forEach(app => (groups[app.category] = groups[app.category] || []).push(app));
        results.innerHTML = Object.keys(groups)
          .sort((a, b) => labelFor(a).localeCompare(labelFor(b)))
          .map(c => `
            <section class="group">
              <h3 class="group-title">${labelFor(c)} <span>${groups[c].length}</span></h3>
              <div class="grid">${groups[c].map(cardHTML).join('')}</div>
            </section>`).join('');
      } else {
        results.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
      }
      lucide.createIcons();
    }

    filters.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      activeCategory = chip.dataset.category;
      filters.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
      render();
    });

    sortEl.addEventListener('click', e => {
      const btn = e.target.closest('button[data-sort]');
      if (!btn) return;
      sortMode = btn.dataset.sort;
      sortEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
      render();
    });

    searchInput.addEventListener('input', render);

    results.addEventListener('click', e => {
      if (e.target.id !== 'clear') return;
      searchInput.value = '';
      activeCategory = 'all';
      buildFilters();
      render();
    });

    // Element SDK: editable title, subtitle and accent colour
    const defaultConfig = {
      page_title: "Learning Apps",
      page_subtitle: "Games, simulators and practice tools for chemistry revision.",
      accent_color: ""
    };

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('page-title').textContent = config.page_title || defaultConfig.page_title;
          document.getElementById('page-subtitle').textContent = config.page_subtitle || defaultConfig.page_subtitle;
          if (config.accent_color) document.documentElement.style.setProperty('--accent', config.accent_color);
        },
        mapToCapabilities: (config) => ({
          recolorables: [{
            get: () => config.accent_color || '#0f766e',
            set: (value) => { config.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
          }],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["page_title", config.page_title || defaultConfig.page_title],
          ["page_subtitle", config.page_subtitle || defaultConfig.page_subtitle]
        ])
      });
    }

    buildFilters();
    render();
    lucide.createIcons();
  </script>
</body>
</html>
