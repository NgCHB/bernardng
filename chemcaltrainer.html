// ─── Calculator ───
function toggleCalculator() {
  const panel = document.getElementById('calculator-panel');
  panel.classList.toggle('hidden');
  lucide.createIcons();
}
function calcInput(val) {
  if (val === 'C') {
    calcExpr = '0';
  } else if (calcExpr === '0' && val !== '.' && isNaN(val) === false) {
    calcExpr = val;
  } else if (calcExpr === '0' && val === '.') {
    calcExpr = '0.';
  } else {
    calcExpr += val;
  }
  updateCalcDisplay();
}

function updateCalcDisplay() {
  const display = calcExpr.replace(/\*/g, '×').replace(/\//g, '÷');
  document.getElementById('calc-display').textContent = display;
}

function calcEquals() {
  try {
    let expr = calcExpr.trim();
    if (!expr || expr === '0') {
      document.getElementById('calc-display').textContent = '0';
      return;
    }
    
    // Safe evaluation using math.js parser or basic evaluation
    const result = evaluateMath(expr);
    
    if (typeof result === 'number' && isFinite(result)) {
      const rounded = Math.round(result * 100000) / 100000;
      calcExpr = String(rounded);
      updateCalcDisplay();
    } else {
      showCalcError();
    }
  } catch (e) {
    showCalcError();
  }
}

function evaluateMath(expr) {
  // Remove spaces
  expr = expr.replace(/\s/g, '');
  
  // Tokenize and evaluate with proper operator precedence
  return parseAddSub(expr, 0).value;
}

function parseAddSub(expr, pos) {
  let result = parseMulDiv(expr, pos);
  pos = result.pos;
  
  while (pos < expr.length && (expr[pos] === '+' || expr[pos] === '-')) {
    const op = expr[pos];
    pos++;
    const right = parseMulDiv(expr, pos);
    pos = right.pos;
    result.value = op === '+' ? result.value + right.value : result.value - right.value;
  }
  
  return { value: result.value, pos };
}

function parseMulDiv(expr, pos) {
  let result = parseParens(expr, pos);
  pos = result.pos;
  
  while (pos < expr.length && (expr[pos] === '*' || expr[pos] === '/')) {
    const op = expr[pos];
    pos++;
    const right = parseParens(expr, pos);
    pos = right.pos;
    result.value = op === '*' ? result.value * right.value : result.value / right.value;
  }
  
  return { value: result.value, pos };
}

function parseParens(expr, pos) {
  if (expr[pos] === '(') {
    pos++;
    const result = parseAddSub(expr, pos);
    pos = result.pos + 1; // skip closing )
    return { value: result.value, pos };
  }
  
  return parseNumber(expr, pos);
}

function parseNumber(expr, pos) {
  let numStr = '';
  let hasDecimal = false;
  
  while (pos < expr.length) {
    const char = expr[pos];
    if (char >= '0' && char <= '9') {
      numStr += char;
      pos++;
    } else if (char === '.' && !hasDecimal) {
      numStr += char;
      hasDecimal = true;
      pos++;
    } else {
      break;
    }
  }
  
  return { value: parseFloat(numStr || '0'), pos };
}

function showCalcError() {
  document.getElementById('calc-display').textContent = 'Error';
  setTimeout(() => {
    calcExpr = '0';
    document.getElementById('calc-display').textContent = '0';
  }, 1500);
}

// ─── Helpers ───
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateStepIndicators() {
  for (let i = 0; i <= 7; i++) {
    const circle = document.getElementById(`step-${i}-circle`);
    const badge = circle.closest('.step-badge');
    if (i < currentStep) {
      circle.style.background = '#065f46';
      circle.style.color = '#10b981';
      badge.classList.remove('active');
    } else if (i === currentStep) {
      circle.style.background = '#10b981';
      circle.style.color = '#0c0f1a';
      badge.classList.add('active');
    } else {
      circle.style.background = '#1a1f35';
      circle.style.color = '#475569';
      badge.classList.remove('active');
    }
  }
}

function updateScore() {
  document.getElementById('score-display').textContent = `${score}/${totalAnswered}`;
}

function renderMrTable(mrData) {
  let rows = '';
  for (const [sub, mr] of Object.entries(mrData)) {
    rows += `<div class="flex justify-between px-3 py-1.5 rounded" style="background:#0c0f1a;">
      <span class="mono text-sm" style="color:#94a3b8;">${sub}</span>
      <span class="mono text-sm font-600" style="color:#e2e8f0;">${mr}</span>
    </div>`;
  }
  return `<div class="mt-3 p-3 rounded-xl" style="background:#131833;border:1px solid #1e2740;">
    <div class="flex items-center gap-2 mb-2">
      <i data-lucide="info" style="width:14px;height:14px;color:#10b981;"></i>
      <span class="text-xs font-600" style="color:#10b981;">Relative Formula Mass (Mr)</span>
    </div>
    <div class="grid gap-1.5">${rows}</div>
  </div>`;
}

function makeOptionButtons(options, correctIndex, onCorrect) {
  const shuffled = options.map((text, i) => ({ text, isCorrect: i === correctIndex }));
  const mixed = shuffleArray(shuffled);
  let html = '<div class="grid gap-2 mt-4">';
  mixed.forEach((opt, idx) => {
    html += `<button class="option-btn text-left px-4 py-3 rounded-xl text-sm font-500 mono" 
      style="background:#1a1f35;color:#e2e8f0;border:1px solid #2a3352;" 
      data-correct="${opt.isCorrect}" id="opt-${idx}"
      onclick="handleOption(this, ${opt.isCorrect}, '${onCorrect}')">${opt.text}</button>`;
  });
  html += '</div>';
  return html;
}

function handleOption(btn, isCorrect, callbackName) {
  const allBtns = btn.parentElement.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.style.background = '#065f46';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
    btn.classList.add('correct');
    score++;
    totalAnswered++;
    updateScore();
    setTimeout(() => { window[callbackName](); }, 800);
  } else {
    btn.style.background = '#7f1d1d';
    btn.style.borderColor = '#ef4444';
    btn.style.color = '#fca5a5';
    btn.classList.add('wrong');
    allBtns.forEach(b => {
      if (b.dataset.correct === 'true') {
        b.style.background = '#065f46';
        b.style.borderColor = '#10b981';
        b.style.color = '#10b981';
      }
    });
    totalAnswered++;
    updateScore();
    // Show next button instead of auto-advancing
    showNextButton(callbackName);
  }
}

function handleNumericSubmit(inputId, correctAnswer, callbackName, tolerance) {
  const input = document.getElementById(inputId);
  const val = parseFloat(input.value);
  const feedback = document.getElementById(inputId + '-feedback');
  const btn = document.getElementById(inputId + '-btn');
  btn.disabled = true;
  input.disabled = true;
  const tol = tolerance || 0.05;
  if (!isNaN(val) && Math.abs(val - correctAnswer) <= tol) {
    feedback.innerHTML = `<span style="color:#10b981;">✓ Correct! The answer is ${correctAnswer}</span>`;
    input.style.borderColor = '#10b981';
    score++;
    totalAnswered++;
    updateScore();
    setTimeout(() => { window[callbackName](); }, 1200);
  } else {
    feedback.innerHTML = `<span style="color:#ef4444;">✗ The correct answer is ${correctAnswer}</span>`;
    input.style.borderColor = '#ef4444';
    totalAnswered++;
    updateScore();
    // Show next button instead of auto-advancing
    setTimeout(() => { showNextButton(callbackName); }, 1200);
  }
}

function showNextButton(callbackName) {
  const container = document.getElementById('content-area');
  let nextBtn = container.querySelector('#continue-btn');
  if (!nextBtn) {
    nextBtn = document.createElement('button');
    nextBtn.id = 'continue-btn';
    nextBtn.textContent = 'Continue →';
    nextBtn.style.cssText = 'margin-top:1.25rem;width:100%;padding:0.75rem;border-radius:0.75rem;font-size:0.875rem;font-weight:700;background:#10b981;color:#0c0f1a;cursor:pointer;border:none;';
    nextBtn.onclick = () => { window[callbackName](); };
    const contentArea = document.getElementById('content-area');
    contentArea.appendChild(nextBtn);
  }
}

// Step 5: C2 - Select mole ratio and compute target moles
function goToStep5() {
  currentStep = 5;
  updateStepIndicators();
  const q = currentQuestion;
  const givenCoeff = q.coefficients[q.givenSubstance];
  const targetCoeff = q.coefficients[q.targetSubstance];
  
  // Simplify ratio to lowest terms
  const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
  const divisor = gcd(givenCoeff, targetCoeff);
  const simplifiedGiven = givenCoeff / divisor;
  const simplifiedTarget = targetCoeff / divisor;
  const correctRatio = `${simplifiedGiven} : ${simplifiedTarget}`;
  
  // Build ratio options - ensure no duplicates and avoid showing multiples of 1:1
  let ratioOptions = [correctRatio];
  const possibleRatios = [
    `${simplifiedTarget} : ${simplifiedGiven}`,  // reversed
    `2 : 1`,
    `1 : 2`,
    `3 : 1`,
    `1 : 3`,
    `2 : 3`,
    `3 : 2`,
    `4 : 1`,
    `1 : 4`,
    `3 : 4`,
    `4 : 3`
  ];
  
  // Filter out multiples of the correct ratio and avoid duplicates
  possibleRatios.forEach(r => {
    if (!ratioOptions.includes(r) && ratioOptions.length < 4) {
      // Don't include multiples of 1:1 if the answer is 1:1
      if (correctRatio === '1 : 1' && (r === '2 : 2' || r === '3 : 3')) return;
      ratioOptions.push(r);
    }
  });
  
  while (ratioOptions.length < 4) {
    const newRatio = `${Math.floor(Math.random()*4)+1} : ${Math.floor(Math.random()*4)+1}`;
    if (!ratioOptions.includes(newRatio)) ratioOptions.push(newRatio);
  }
  
  c2Moles = (q.c1Answer / givenCoeff) * targetCoeff;
  c2Moles = Math.round(c2Moles * 10000) / 10000;

  const correctIdx = 0;
  const shuffled = ratioOptions.map((text, i) => ({ text: `${q.givenSubstance} : ${q.targetSubstance} = ${text}`, isCorrect: i === correctIdx }));
  const mixed = shuffleArray(shuffled);

  let btns = '<div class="grid gap-2 mt-4">';
  mixed.forEach((opt, idx) => {
    btns += `<button class="option-btn text-left px-4 py-3 rounded-xl text-sm font-500 mono" 
      style="background:#1a1f35;color:#e2e8f0;border:1px solid #2a3352;" 
      data-correct="${opt.isCorrect}" id="s5-opt-${idx}"
      onclick="handleOption(this, ${opt.isCorrect}, 'goToStep5b')">${opt.text}</button>`;
  });
  btns += '</div>';

  document.getElementById('content-area').innerHTML = `
    <div class="fade-in">
      <div class="p-4 rounded-xl mb-4" style="background:#0c0f1a;border-left:3px solid #10b981;">
        <p class="text-xs mono mb-1" style="color:#64748b;">Question</p>
        <p class="text-sm font-500" style="color:#e2e8f0;">${q.questionText}</p>
        <p class="text-xs mono mt-2" style="color:#94a3b8;">Equation: ${q.equation}</p>
      </div>
      <div class="flex items-center gap-2 mb-4">
        <span class="px-2.5 py-1 rounded-lg text-xs font-700" style="background:#8b5cf6;color:#fff;">C2: COMPARE MOLE RATIO</span>
      </div>
      <div class="p-5 rounded-2xl" style="background:#131833;border:1px solid #1e2740;">
        <div class="p-3 rounded-lg mb-4" style="background:#0c0f1a;">
          <p class="text-xs" style="color:#64748b;">We have <span class="font-600" style="color:#10b981;">${q.c1Answer} mol of ${q.givenSubstance}</span> and need to find mol of <span class="font-600" style="color:#f59e0b;">${q.targetSubstance}</span></p>
        </div>
        <p class="text-base font-600" style="color:#e2e8f0;">What is the mole ratio of ${q.givenSubstance} to ${q.targetSubstance}?</p>
        <p class="text-xs mt-1" style="color:#64748b;">Look at the coefficients in the balanced equation.</p>
